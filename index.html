<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Obras - Sigelu Clone (Supabase)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="root" class="w-full max-w-4xl bg-white rounded-lg shadow-xl overflow-hidden">
        <!-- React app will be mounted here -->
        <div class="flex items-center justify-center h-64 bg-gray-100 text-gray-500">
            Carregando aplicação...
        </div>
    </div>

    <!-- React and ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX transformation in browser (for development, not production) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module">
        // Variáveis globais para Supabase URL e Anon Key
        const supabaseUrl = 'SUA_SUPABASE_URL_AQUI'; // Substitua pela sua URL do projeto Supabase
        const supabaseAnonKey = 'SUA_SUPABASE_ANON_KEY_AQUI'; // Substitua pela sua Anon Key do projeto Supabase

        // Inicializa o cliente Supabase
        const supabase = Supabase.createClient(supabaseUrl, supabaseAnonKey);

        // Torna o cliente Supabase globalmente disponível para o aplicativo React
        window.supabase = supabase;

        // Link para o arquivo JavaScript externo (com type="text/babel" para JSX)
        const script = document.createElement('script');
        script.src = './script.js';
        script.type = 'text/babel';
        document.body.appendChild(script);
    </script>
</body>
</html>
